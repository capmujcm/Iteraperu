<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ITERA Post 08</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #0B0D10;
      color: #FFFFFF;
      font-family: 'Satoshi', sans-serif;
    }
    .post-container {
      position: relative;
      width: 1080px;
      height: 1080px;
      padding: 80px 84px 74px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0B0D10;
      overflow: hidden;
    }
    .bg-loop {
      position: absolute;
      right: -80px;
      bottom: -60px;
      width: 720px;
      height: 720px;
      pointer-events: none;
      z-index: 1;
    }
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
    }
    .brand-name {
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 0.16em;
      color: #FFFFFF;
    }
    .tag-series {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 18px;
      border-radius: 6px;
    }
    .content-block {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 820px;
    }
    .category-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #7C97FF;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .category-label::before {
      content: "";
      width: 24px;
      height: 2px;
      background: #315CFF;
    }
    .headline {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .headline span.accent {
      color: #315CFF;
    }
    .subheadline {
      font-size: 26px;
      color: rgba(237,240,246,0.75);
      line-height: 1.45;
    }
    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.14em;
      color: #315CFF;
      text-transform: uppercase;
      font-weight: 600;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="post-container">
    <svg class="bg-loop" viewBox="0 0 600 600" fill="none">
      <defs>
        <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#315CFF" stop-opacity="0.8"/>
          <stop offset="50%" stop-color="#315CFF" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#315CFF" stop-opacity="0.6"/>
        </linearGradient>
      </defs>
      <circle cx="300" cy="300" r="230" stroke="url(#loopGrad)" stroke-width="4" stroke-dasharray="16 8"/>
      <circle cx="300" cy="300" r="180" stroke="#315CFF" stroke-opacity="0.2" stroke-width="2"/>
      <circle cx="300" cy="70" r="10" fill="#315CFF"/>
      <circle cx="530" cy="300" r="8" fill="#315CFF"/>
      <circle cx="300" cy="530" r="6" fill="#315CFF"/>
    </svg>

    <div class="top-bar">
      <div class="brand-wrap">
        <img class="brand-logo" src="assets/itera-mark.svg" alt="ITERA">
        <span class="brand-name">ITERA</span>
      </div>
      <span class="tag-series">S30 · FILOSOFÍA</span>
    </div>

    <div class="content-block">
      <div class="category-label">MEJORA CONTINUA</div>
      <h1 class="headline">Mejorar no es un proyecto.<br><span class="accent">Es un ciclo permanente.</span></h1>
      <p class="subheadline">La transformación real no concluye con un despliegue. Se sostiene cuestionando, simplificando y evolucionando continuamente.</p>
    </div>

    <div class="bottom-bar">
      <span class="tagline">Entender · Optimizar · Anticipar</span>
      <span class="url">itera.pe</span>
    </div>
  </div>
</body>
</html>
