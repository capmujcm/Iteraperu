<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ITERA Post 05</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #0B0D10;
      color: #FFFFFF;
      font-family: 'Satoshi', sans-serif;
    }
    .post-container {
      position: relative;
      width: 1080px;
      height: 1080px;
      padding: 80px 84px 74px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0B0D10;
      overflow: hidden;
    }
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
    }
    .brand-name {
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 0.16em;
      color: #FFFFFF;
    }
    .tag-series {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 18px;
      border-radius: 6px;
    }
    .content-block {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .category-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #7C97FF;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .category-label::before {
      content: "";
      width: 24px;
      height: 2px;
      background: #315CFF;
    }
    .headline {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .headline span.accent {
      color: #315CFF;
    }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 10px;
    }
    .metric-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 26px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: #315CFF;
      letter-spacing: -0.03em;
    }
    .metric-label {
      font-size: 17px;
      color: rgba(237,240,246,0.7);
      line-height: 1.35;
    }
    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.14em;
      color: #315CFF;
      text-transform: uppercase;
      font-weight: 600;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="post-container">
    <div class="top-bar">
      <div class="brand-wrap">
        <img class="brand-logo" src="assets/itera-mark.svg" alt="ITERA">
        <span class="brand-name">ITERA</span>
      </div>
      <span class="tag-series">S23 · RESULTADOS</span>
    </div>

    <div class="content-block">
      <div class="category-label">IMPACTO EN OPERACIONES</div>
      <h1 class="headline">Transformación real.<br><span class="accent">Resultados medibles.</span></h1>

      <div class="metrics-row">
        <div class="metric-box">
          <div class="metric-value">-60%</div>
          <div class="metric-label">Tiempo de ciclo en procesos clave</div>
        </div>
        <div class="metric-box">
          <div class="metric-value">100%</div>
          <div class="metric-label">Trazabilidad y visibilidad en tiempo real</div>
        </div>
        <div class="metric-box">
          <div class="metric-value">0</div>
          <div class="metric-label">Pasos redundantes en la operación</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <span class="tagline">Entender · Optimizar · Anticipar</span>
      <span class="url">itera.pe</span>
    </div>
  </div>
</body>
</html>
